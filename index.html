<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배당관리 대시보드</title>
<style>
  :root{
    --bg:#f7f4ec;
    --bg-soft:#eee7d9;
    --card:#ffffff;
    --card-hi:#faf6ec;
    --line:#e4dcc9;
    --text:#2c2620;
    --muted:#6d6252;
    --muted2:#948a78;
    --gold:#a97a2e;
    --gold-soft:rgba(169,122,46,0.12);
    --teal:#2f8474;
    --teal-soft:rgba(47,132,116,0.12);
    --up:#3f8f5f;
    --down:#c25a44;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(169,122,46,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 48px 0;
  }
  .wrap{max-width:720px;margin:0 auto;padding:22px 16px 0;}
  .two-col{display:block;}

  @media (min-width:700px){
    .wrap{max-width:900px;padding:28px 24px 0;}
    h1{font-size:32px;}
    .kpi-grid{grid-template-columns:repeat(4,1fr);}
  }
  @media (min-width:1000px){
    .wrap{max-width:1120px;}
    .two-col{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start;}
    .two-col .section{margin-bottom:0;}
  }
  @media (min-width:1300px){
    .wrap{max-width:1280px;}
  }

  /* Header */
  .eyebrow{
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin-bottom:6px;
  }
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:700;
    font-size:28px;
    line-height:1.15;
    margin:0 0 4px 0;
    color:var(--text);
  }
  .subhead{color:var(--muted);font-size:13.5px;margin-bottom:22px;}
  .subhead b{color:var(--text);font-weight:600;}

  /* KPI grid */
  .kpi-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;
  }
  .kpi{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px 12px;
    position:relative;
    overflow:hidden;
  }
  .kpi::after{
    content:"";position:absolute;top:0;left:0;width:3px;height:100%;
    background:var(--gold-line,var(--gold));opacity:.55;
  }
  .kpi.teal::after{background:var(--teal);}
  .kpi-label{font-size:11px;color:var(--muted2);letter-spacing:.03em;margin-bottom:6px;}
  .kpi-value{font-family:'Source Serif 4',serif;font-size:21px;font-weight:600;color:var(--text);white-space:nowrap;}
  .kpi-delta{font-size:11.5px;margin-top:5px;font-weight:600;}
  .kpi-delta.up{color:var(--up);}
  .kpi-delta.down{color:var(--down);}
  .kpi-delta.flat{color:var(--muted);}

  /* Section */
  .section{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 16px 14px;
    margin-bottom:16px;
  }
  .section-title{
    font-family:'Source Serif 4',serif;
    font-size:16px;font-weight:600;color:var(--text);margin:0 0 2px 0;
  }
  .section-sub{font-size:12px;color:var(--muted2);margin-bottom:12px;}
  .chart-holder{position:relative;width:100%;}

  /* Legend chips */
  .chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .chip{
    font-size:11.5px;padding:5px 10px;border-radius:999px;
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    display:flex;align-items:center;gap:6px;
  }
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

  .chip.tab{cursor:pointer;font-weight:600;transition:all .15s;}
  .chip.tab.active{background:var(--gold-soft);border-color:rgba(169,122,46,.4);color:var(--gold);}
  .chip.tab.disabled{opacity:.35;cursor:not-allowed;}
  .ym-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .ym-row:last-child{border-bottom:none;}
  .ym-rank{color:var(--gold);font-weight:700;width:18px;display:inline-block;font-size:11px;}
  .ym-name{color:var(--text);}
  .ym-sub{color:var(--muted2);font-size:11px;margin-top:1px;}
  .ym-val{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600;}
  .ym-empty{color:var(--muted2);font-size:12.5px;text-align:center;padding:24px 0;}

  /* Bars (custom, for account/owner breakdown) */
  .bar-row{margin-bottom:11px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .bar-name{color:var(--text);font-weight:500;}
  .bar-val{color:var(--muted);font-variant-numeric:tabular-nums;}
  .bar-track{height:8px;border-radius:5px;background:var(--bg-soft);overflow:hidden;}
  .bar-fill{height:100%;border-radius:5px;}
  .bar-row.clickable{cursor:pointer;padding:6px 8px;margin:0 -8px 3px;border-radius:8px;transition:background .15s;}
  .bar-row.clickable:hover, .bar-row.clickable:active{background:var(--bg-soft);}
  .bar-row.clickable .bar-name::after{content:" ›";color:var(--muted2);}

  .bar-row.clickable.selected{background:var(--gold-soft);}
  .bar-row.clickable.selected .bar-name{color:var(--gold);}
  #accountBars{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .owner-group{margin-bottom:16px;min-width:0;}
  .owner-group:last-child{margin-bottom:0;}
  .owner-group-head{flex-wrap:wrap;}
  .owner-group .bar-name{font-size:12px;}
  .owner-group .bar-val{font-size:11px;}
  .owner-group .bar-row.clickable{padding:6px 6px;margin:0 -6px 3px;}
  .owner-group .bar-top{flex-direction:column;align-items:flex-start;gap:1px;}
  .owner-group-head{
    display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;
    color:var(--text);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line);
  }
  .owner-group-val{margin-left:auto;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
  .close-btn{
    background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
    font-size:11px;padding:5px 10px;border-radius:999px;cursor:pointer;font-family:inherit;
  }
  .close-btn:active{background:var(--line);}

  /* Table */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
  th{
    text-align:left;font-weight:600;color:var(--muted2);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.04em;
    padding:0 8px 8px 0;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--card);
  }
  td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);color:var(--text);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .rank{color:var(--gold);font-weight:700;width:20px;display:inline-block;}
  .tag{
    font-size:10px;padding:2px 7px;border-radius:999px;
    background:var(--bg-soft);color:var(--muted);border:1px solid var(--line);
  }
  .tag.owner-본인{color:var(--gold);border-color:rgba(169,122,46,.3);}
  .tag.owner-배우자{color:var(--teal);border-color:rgba(47,132,116,.3);}

  /* search */
  .search-box{
    width:100%;padding:10px 12px;border-radius:10px;background:var(--bg-soft);
    border:1px solid var(--line);color:var(--text);font-size:13px;margin-bottom:12px;
    font-family:inherit;
  }
  .search-box::placeholder{color:var(--muted2);}

  .foot-note{font-size:11px;color:var(--muted2);text-align:center;margin-top:18px;line-height:1.6;}

  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">DIVIDEND LEDGER · 2026</div>
  <h1>배당관리 대시보드</h1>
  <div class="subhead" id="subhead">구글 시트에서 데이터를 불러오는 중…</div>
  <div id="loadStatus"></div>

  <div class="section">
    <div class="section-title">연도 · 월별 배당 내역</div>
    <div class="section-sub" id="ymSub"></div>
    <div class="chips" id="yearTabs"></div>
    <div id="ymList" style="margin-top:14px;"></div>
  </div>

  <div class="two-col">
  <div class="section">
    <div class="section-title">월별 배당 합계 추이</div>
    <div class="section-sub">1월 – 7월, 전 계좌 합산 (원)</div>
    <div class="chart-holder" id="trendChart" style="height:220px;"></div>
  </div>

  <div class="section">
    <div class="section-title">소유주 · 계좌별 비중</div>
    <div class="section-sub" id="ownerSectionSub">최근월(7월) 배당 기준</div>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:14px;">
      <div class="chart-holder" id="ownerDonut" style="height:150px;width:150px;flex:none;"></div>
      <div id="ownerLegend" style="flex:1;"></div>
    </div>
    <div id="accountBars"></div>
    <div id="accountDetailWrap" style="display:none;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="section-title" id="accountDetailTitle" style="font-size:14px;"></div>
        <button id="closeDetail" class="close-btn">닫기 ✕</button>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr><th>종목명</th><th class="num">배당률</th><th class="num" id="detailMonthHeader">7월</th><th class="num" id="detailPrevMonthHeader">6월</th></tr>
          </thead>
          <tbody id="accountDetailBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  </div>

  <div class="foot-note">업로드하신 배당관리.xlsx 데이터를 기준으로 자동 집계했습니다.<br>합계 행은 검증용으로 제외하고 계산했습니다.<br>상단 월별 막대를 누르면 아래 계좌별 비중이 해당 월 기준으로 바뀝니다.<br>계좌 막대를 누르면 해당 계좌의 보유 종목이 펼쳐집니다.</div>
</div>

<script>
let RAW = [];

// ---- 구글 시트(gviz JSONP) 연동 — CORS 제약을 받지 않는 스크립트 태그 방식 ----
const SHEET_ID = '1Ky8-z2_ynidm6otjIjZehw743wj9Vp8QK5usfOXXhJY';
const SHEET_GID = '0';

function jsonpLoad(url, callbackName, timeoutMs = 15000){
  return new Promise((resolve, reject)=>{
    let done = false;
    const script = document.createElement('script');
    const cleanup = () => {
      delete window[callbackName];
      if(script.parentNode) script.parentNode.removeChild(script);
    };
    window[callbackName] = (data) => {
      done = true;
      cleanup();
      resolve(data);
    };
    script.onerror = () => {
      if(!done){ cleanup(); reject(new Error('스크립트 로드 실패 (시트 접근 권한을 확인해주세요)')); }
    };
    script.src = url;
    document.body.appendChild(script);
    setTimeout(()=>{
      if(!done){ cleanup(); reject(new Error('응답 시간 초과')); }
    }, timeoutMs);
  });
}

function parseGvizTable(data){
  if(!data || !data.table) throw new Error('시트 응답 형식이 올바르지 않습니다.');
  const headers = data.table.cols.map(c => (c.label || '').toString().trim());
  return data.table.rows.map(r=>{
    const obj = {};
    headers.forEach((h,i)=>{
      const cell = r.c && r.c[i];
      let v = '', f = '';
      if(cell){
        if(cell.v !== null && cell.v !== undefined) v = cell.v;
        if(cell.f !== null && cell.f !== undefined) f = cell.f;
      }
      obj[h] = {v, f};
    });
    return obj;
  });
}

function setLoadStatus(html){
  const el = document.getElementById('loadStatus');
  if(el) el.innerHTML = html;
}

async function loadDataFromSheet(){
  try{
    setLoadStatus('데이터 불러오는 중…');
    const cbName = 'gvizCB_' + Date.now();
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${cbName}&gid=${SHEET_GID}`;
    const data = await jsonpLoad(url, cbName);
    const rawRows = parseGvizTable(data);
    if(rawRows.length === 0) throw new Error('시트에 데이터가 없습니다.');

    const numKeys = ['1월배당','2월배당','3월배당','4월배당','5월배당','6월배당','7월배당','합계'];
    const textKeys = ['소유주','계좌명','계좌번호','종목명'];

    RAW = rawRows
      .map(r=>{
        const obj = {};
        Object.keys(r).forEach(k=>{
          const cell = r[k] || {v:'', f:''};
          if(numKeys.includes(k)){
            const raw = (typeof cell.v === 'number') ? cell.v : (cell.v || cell.f || '').toString().replace(/,/g,'').trim();
            obj[k] = raw === '' ? 0 : Number(raw);
          } else if(k === '최근배당률'){
            const s = (cell.f || cell.v || '').toString().trim();
            obj[k] = s === '' ? null : s;
          } else {
            obj[k] = (cell.v !== undefined && cell.v !== null && cell.v !== '') ? cell.v.toString().trim() : (cell.f || '').toString().trim();
          }
        });
        return obj;
      })
      .filter(r => r['소유주'] && r['종목명'] && r['소유주'] !== '합계' && r['계좌명'] !== '합계');

    if(RAW.length === 0) throw new Error('유효한 종목 데이터를 찾지 못했습니다.');

    setLoadStatus('');
    initDashboard();
  }catch(err){
    setLoadStatus(`
      <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--muted);font-size:13px;line-height:1.6;">
        <b style="color:var(--down);">시트를 불러오지 못했습니다.</b><br>
        (${(err && err.message) ? err.message : err})<br><br>
        시트 공유 설정이 "링크가 있는 모든 사용자 · 뷰어"인지 확인해주세요.
        <button id="retryLoad" style="margin-top:10px;display:block;background:var(--bg-soft);border:1px solid var(--line);color:var(--text);font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;">다시 시도</button>
      </div>`);
    const retryBtn = document.getElementById('retryLoad');
    if(retryBtn) retryBtn.addEventListener('click', loadDataFromSheet);
  }
}

function initDashboard(){

const MONTHS = ['1월','2월','3월','4월','5월','6월','7월'];
const MKEYS = ['1월배당','2월배당','3월배당','4월배당','5월배당','6월배당','7월배당'];
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const fmtMan = n => (n/10000).toLocaleString('ko-KR',{maximumFractionDigits:0}) + '만원';

// ---- Aggregations ----
const monthlyTotals = MKEYS.map(k => RAW.reduce((s,r)=>s+(r[k]||0),0));
const grandTotal = monthlyTotals.reduce((a,b)=>a+b,0);
const accountCount = new Set(RAW.map(r=>r.소유주+' · '+r.계좌명)).size;

let curMonthKey = MKEYS[MKEYS.length-1]; // 기본값: 최근월(7월)
const ownerColors = {'본인':'#a97a2e','배우자':'#2f8474'};

function computeOwnerAccount(monthKey){
  const ownerTotals = {};
  const accountTotals = {};
  RAW.forEach(r=>{
    const v = r[monthKey]||0;
    ownerTotals[r.소유주] = (ownerTotals[r.소유주]||0) + v;
    const key = r.소유주 + ' · ' + r.계좌명;
    accountTotals[key] = (accountTotals[key]||0) + v;
  });
  return {ownerTotals, accountTotals};
}

// ---- 연도 · 월별 배당 내역 (내림차순, 클릭 가능) ----
let curYear = 2026;

function renderYearTabs(){
  document.getElementById('yearTabs').innerHTML = [2026,2025].map(y=>{
    const has = y === 2026;
    const cls = ['chip','tab', y===curYear?'active':'', has?'':'disabled'].filter(Boolean).join(' ');
    return `<span class="${cls}" data-year="${y}">${y}년${has?'':' (데이터 없음)'}</span>`;
  }).join('');
}

function renderYmContent(){
  document.getElementById('ymSub').textContent = `${curYear}년 월별 배당 합계 · 막대를 누르면 아래 내역이 바뀌어요`;
  if(curYear !== 2026){
    document.getElementById('ymList').innerHTML = `<div class="ym-empty">${curYear}년 데이터가 없습니다.</div>`;
    return;
  }
  const monthRows = MKEYS.map((k,i)=>({label:MONTHS[i], key:k, val:monthlyTotals[i]})).reverse();
  const maxV = Math.max(...monthRows.map(m=>m.val));
  document.getElementById('ymList').innerHTML = monthRows.map(m=>{
    const pct = maxV>0 ? (m.val/maxV*100).toFixed(1) : 0;
    const selCls = m.key === curMonthKey ? ' selected' : '';
    return `
    <div class="bar-row clickable${selCls}" data-monthkey="${m.key}">
      <div class="bar-top"><span class="bar-name">${m.label}</span><span class="bar-val">${fmt(m.val)}원</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#a97a2e;"></div></div>
    </div>`;
  }).join('');
}

document.getElementById('yearTabs').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-year]');
  if(!el) return;
  curYear = Number(el.dataset.year);
  renderYearTabs(); renderYmContent();
});

document.getElementById('ymList').addEventListener('click', (e)=>{
  const row = e.target.closest('[data-monthkey]');
  if(!row) return;
  curMonthKey = row.dataset.monthkey;
  renderYmContent();
  renderOwnerAccountSection();
  document.getElementById('accountDetailWrap').style.display = 'none';
});

renderYearTabs(); renderYmContent();

// ---- Header subhead ----
document.getElementById('subhead').innerHTML =
  `총 <b>${RAW.length}개</b> 보유 종목 · <b>${accountCount}개</b> 계좌 · 1월~7월 누적 <b>${fmt(grandTotal)}원</b>`;

// ---- SVG trend line chart (no external libs) ----
(function drawTrend(){
  const W = 320, H = 220, padL = 46, padR = 10, padT = 14, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxV = Math.max(...monthlyTotals) * 1.12;
  const minV = 0;
  const xAt = i => padL + (innerW * i/(MONTHS.length-1));
  const yAt = v => padT + innerH - (innerH * (v-minV)/(maxV-minV));

  const pts = monthlyTotals.map((v,i)=>[xAt(i), yAt(v)]);
  const linePath = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${(padT+innerH).toFixed(1)} L${pts[0][0].toFixed(1)},${(padT+innerH).toFixed(1)} Z`;

  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + innerH*f;
    const val = maxV*(1-f);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e4dcc9" stroke-width="1"/>
      <text x="${padL-8}" y="${y+3}" text-anchor="end" font-size="9" fill="#948a78">${fmtMan(val)}</text>`;
  }).join('');

  const xLabels = MONTHS.map((m,i)=>`<text x="${xAt(i)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#6d6252">${m}</text>`).join('');
  const dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#a97a2e" stroke="#f7f4ec" stroke-width="2">
      <title>${MONTHS[i]}: ${fmt(monthlyTotals[i])}원</title></circle>`).join('');

  document.getElementById('trendChart').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;overflow:visible;" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#a97a2e" stop-opacity="0.24"/>
          <stop offset="100%" stop-color="#a97a2e" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaPath}" fill="url(#areaFill)"/>
      <path d="${linePath}" fill="none" stroke="#a97a2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${xLabels}
    </svg>`;
})();

// ---- 소유주/계좌별 비중 (선택된 월 기준, 도넷 + 막대) ----
function drawDonut(ownerEntries, ownerGrandTotal){
  const size = 150, cx = size/2, cy = size/2, r = 58, sw = 20;
  const circ = 2*Math.PI*r;
  let offset = 0;
  const segs = ownerEntries.map(([name,val])=>{
    const frac = ownerGrandTotal>0 ? val/ownerGrandTotal : 0;
    const len = frac*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
      stroke="${ownerColors[name]||'#8B93A0'}" stroke-width="${sw}"
      stroke-dasharray="${len.toFixed(2)} ${(circ-len).toFixed(2)}"
      stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})">
      <title>${name}: ${fmt(val)}원 (${(frac*100).toFixed(1)}%)</title>
    </circle>`;
    offset += len;
    return seg;
  }).join('');
  const monthLabel = MONTHS[MKEYS.indexOf(curMonthKey)] || '';
  document.getElementById('ownerDonut').innerHTML = `
    <svg viewBox="0 0 ${size} ${size}" style="width:100%;height:100%;">
      ${segs}
      <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="10" fill="#6d6252">${monthLabel}</text>
      <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="12.5" fill="#2c2620" font-weight="600">${fmtMan(ownerGrandTotal)}</text>
    </svg>`;
}

function renderOwnerAccountSection(){
  const monthLabel = MONTHS[MKEYS.indexOf(curMonthKey)] || '';
  document.getElementById('ownerSectionSub').textContent = `${monthLabel} 배당 기준`;

  const {ownerTotals, accountTotals} = computeOwnerAccount(curMonthKey);
  const ownerEntries = Object.entries(ownerTotals).sort((a,b)=>b[1]-a[1]);
  const ownerGrandTotal = ownerEntries.reduce((s,e)=>s+e[1],0);

  drawDonut(ownerEntries, ownerGrandTotal);

  document.getElementById('ownerLegend').innerHTML = ownerEntries.map(([name,val])=>`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="display:flex;align-items:center;gap:7px;font-size:13px;">
        <span class="dot" style="background:${ownerColors[name]||'#8B93A0'};"></span>${name}
      </span>
      <span style="font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;">
        ${(ownerGrandTotal>0 ? (val/ownerGrandTotal*100).toFixed(1) : '0.0')}%
      </span>
    </div>
  `).join('') + `<div style="font-size:11px;color:var(--muted2);margin-top:4px;">${monthLabel} 배당 ${fmt(ownerGrandTotal)}원 기준</div>`;

  const accountList = Object.entries(accountTotals).sort((a,b)=>b[1]-a[1]);
  document.getElementById('accountBars').innerHTML = ownerEntries.map(([owner, ownerVal])=>{
    const color = ownerColors[owner]||'#8B93A0';
    const accts = accountList.filter(([name])=>name.split(' · ')[0]===owner);
    const maxAcct = accts.length ? Math.max(...accts.map(a=>a[1])) : 0;
    const rows = accts.map(([name,val])=>{
      const label = name.split(' · ')[1] || name;
      const pct = maxAcct>0 ? (val/maxAcct*100).toFixed(1) : 0;
      const keyAttr = name.replace(/"/g,'&quot;');
      return `
      <div class="bar-row clickable" data-account="${keyAttr}">
        <div class="bar-top"><span class="bar-name">${label}</span><span class="bar-val">${fmt(val)}원</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color};"></div></div>
      </div>`;
    }).join('');
    return `
    <div class="owner-group">
      <div class="owner-group-head">
        <span class="dot" style="background:${color};"></span>${owner}
        <span class="owner-group-val">${fmt(ownerVal)}원</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
}

function showAccountDetail(key){
  const curIdx = MKEYS.indexOf(curMonthKey);
  const monthLabel = MONTHS[curIdx] || '';
  const prevIdx = curIdx - 1;
  const prevMonthKey = prevIdx >= 0 ? MKEYS[prevIdx] : null;
  const prevMonthLabel = prevIdx >= 0 ? MONTHS[prevIdx] : '—';
  document.getElementById('detailMonthHeader').textContent = monthLabel;
  document.getElementById('detailPrevMonthHeader').textContent = prevMonthLabel;
  const rows = RAW.filter(r => (r.소유주 + ' · ' + r.계좌명) === key)
    .slice().sort((a,b)=>(b[curMonthKey]||0)-(a[curMonthKey]||0));
  document.getElementById('accountDetailTitle').textContent = `${key} · 보유 ${rows.length}종목`;
  document.getElementById('accountDetailBody').innerHTML = rows.map(r=>`
    <tr>
      <td>${r.종목명}</td>
      <td class="num">${r.최근배당률 || '—'}</td>
      <td class="num"><b>${fmt(r[curMonthKey]||0)}</b></td>
      <td class="num">${prevMonthKey ? fmt(r[prevMonthKey]||0) : '—'}</td>
    </tr>`).join('');
  const wrap = document.getElementById('accountDetailWrap');
  wrap.style.display = 'block';
  wrap.scrollIntoView({behavior:'smooth', block:'nearest'});
}

document.getElementById('accountBars').addEventListener('click', (e)=>{
  const row = e.target.closest('.bar-row');
  if(!row) return;
  showAccountDetail(row.dataset.account);
});

document.getElementById('closeDetail').addEventListener('click', ()=>{
  document.getElementById('accountDetailWrap').style.display = 'none';
});

renderOwnerAccountSection();

} // end initDashboard

loadDataFromSheet();
</script>
</body>
</html>
